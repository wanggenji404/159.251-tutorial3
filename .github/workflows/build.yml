# This workflow runs the Maven test suite for this project on every push and pull request.
# The tutorial's CI demonstration uses the step below ("Run tests" -> mvn clean test)
# so that each pushed commit gets a green or red status on the Actions tab.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    # Run tests
    - name: Run tests
      run: mvn clean test
